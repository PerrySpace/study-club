<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 614" width="100%" role="img" aria-label="学习俱乐部系统架构">
  <title>学习俱乐部（study-club）系统架构</title>
  <desc>客户端层（Web PWA 与管理后台）经 nginx 同源反代接入 FastAPI 服务层，数据落 MongoDB 与素材存储，内容以仓库 JSON 导入；需企业主体的能力处于掩藏层。</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">

    <rect x="40" y="30" width="800" height="104" rx="14" fill="#F7F9F8" stroke="#DFE8E2" stroke-width="1"/>
    <text x="60" y="54" font-size="13" fill="#5F5E5A">客户端</text>
    <rect x="60" y="66" width="380" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="250" y="86" font-size="14" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">apps/web · 学生端 / 家长端</text>
    <text x="250" y="105" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">Vue 3 PWA · 手机 / iPad / 桌面三档</text>
    <rect x="460" y="66" width="360" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="640" y="86" font-size="14" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">apps/admin · 内容后台</text>
    <text x="640" y="105" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">Vue 3 + Element Plus · 单管理员</text>

    <line x1="440" y1="134" x2="440" y2="150" stroke="#888780" stroke-width="1.5" marker-end="url(#arw)"/>

    <rect x="40" y="150" width="800" height="76" rx="14" fill="#F7F9F8" stroke="#DFE8E2" stroke-width="1"/>
    <text x="60" y="174" font-size="13" fill="#5F5E5A">接入</text>
    <rect x="60" y="186" width="760" height="30" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="440" y="202" font-size="12.5" fill="#3C3489" text-anchor="middle" dominant-baseline="central">nginx 同源反代 /api/ → 127.0.0.1:8000 —— 换访问地址不必重建产物</text>

    <line x1="440" y1="226" x2="440" y2="246" stroke="#888780" stroke-width="1.5" marker-end="url(#arw)"/>

    <rect x="40" y="246" width="800" height="132" rx="14" fill="#F7F9F8" stroke="#DFE8E2" stroke-width="1"/>
    <text x="60" y="270" font-size="13" fill="#5F5E5A">服务</text>
    <rect x="60" y="282" width="760" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="440" y="304" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">apps/api · FastAPI + uvicorn（Python 3.12）</text>
    <text x="440" y="324" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">统一前缀 /api/v1 · 响应信封 {code, message, data|errors, request_id}</text>
    <text x="440" y="348" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">content · auth · children · learning · reports · stats · feedbacks · sync · assets</text>

    <line x1="440" y1="378" x2="440" y2="398" stroke="#888780" stroke-width="1.5" marker-end="url(#arw)"/>

    <rect x="40" y="398" width="800" height="104" rx="14" fill="#F7F9F8" stroke="#DFE8E2" stroke-width="1"/>
    <text x="60" y="422" font-size="13" fill="#5F5E5A">数据</text>
    <rect x="60" y="434" width="250" height="52" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
    <text x="185" y="453" font-size="13.5" font-weight="600" fill="#854F0B" text-anchor="middle" dominant-baseline="central">MongoDB 7</text>
    <text x="185" y="471" font-size="11.5" fill="#BA7517" text-anchor="middle" dominant-baseline="central">服务端唯一真源</text>
    <rect x="325" y="434" width="245" height="52" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
    <text x="447" y="453" font-size="13.5" font-weight="600" fill="#854F0B" text-anchor="middle" dominant-baseline="central">素材存储</text>
    <text x="447" y="471" font-size="11.5" fill="#BA7517" text-anchor="middle" dominant-baseline="central">磁盘 / 命名卷 + assets 集合</text>
    <rect x="585" y="434" width="235" height="52" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
    <text x="702" y="453" font-size="13.5" font-weight="600" fill="#854F0B" text-anchor="middle" dominant-baseline="central">内容仓库</text>
    <text x="702" y="471" font-size="11.5" fill="#BA7517" text-anchor="middle" dominant-baseline="central">content/ JSON → seed 导入</text>

    <line x1="440" y1="502" x2="440" y2="522" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arw)"/>

    <rect x="40" y="522" width="800" height="72" rx="14" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1" stroke-dasharray="6 5"/>
    <text x="60" y="546" font-size="13" fill="#A32D2D">掩藏层 / 本期不做</text>
    <text x="440" y="568" font-size="12" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">手机号 / 微信账号 · 支付 · 推送 · 小程序 · App（需企业主体） · 多角色 RBAC（本期不做）</text>
    <text x="440" y="584" font-size="12" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">写契约 · 默认关 · 不打包 · 不部署</text>

  </g>
</svg>
