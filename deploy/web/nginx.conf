# ============================================================================
# deploy/web/nginx.conf —— apps/web 的静态托管配置（**模板**）
#
# 说明：
#  - `${WEB_PORT}` 由容器启动时的 envsubst 渲染（见 apps/web/Dockerfile
#    的 NGINX_ENVSUBST_FILTER，只替换该变量）。默认 8080。
#  - 容器使用 host 网络：**不监听 80**，避免与宿主机上既有服务冲突。
# ============================================================================

server {
    listen       ${WEB_PORT};
    listen       [::]:${WEB_PORT};
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;

    charset      utf-8;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # ⚠️ microphone 必须放行同源：跟读（语音识别）要用麦克风。
    #    写 `microphone=()` 会让浏览器直接拒绝 getUserMedia / SpeechRecognition，
    #    表现为「读了好几遍都没反应」，且控制台报的是权限错误，很容易查错方向。
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

    # HSTS：**仅在已配置 HTTPS 时开启**（直接暴露 HTTP 端口时开启会把用户锁在 HTTPS）。
    # 前置条件：外层已有 TLS 终止（反代/网关）且全站可 HTTPS，再取消下一行注释。
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- 压缩 ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/x-javascript text/javascript image/svg+xml application/manifest+json;
    # brotli 需要额外模块（nginx:alpine 默认未编译）。
    # 若使用带 brotli 的镜像（如 openresty 或自编译 nginx），可启用：
    # brotli            on;
    # brotli_comp_level 5;
    # brotli_types      text/plain text/css application/json application/javascript image/svg+xml;

    # ---- 接口反代（同源化，**不是可选项**）----
    # 前端是静态站，接口在另一个端口/进程上。若让浏览器直连后端，会撞上两堵墙，
    # 而且**两堵都不是「配一下 CORS 就能过」**：
    #   ① 混合内容：HTTPS 页面（如 https://study.example.com）发起的 fetch 指向
    #      http://<ip>:8000 会被浏览器**直接拦下**，请求根本发不出去 —— 此时把
    #      access-control-allow-origin 配得再对也没有用，控制台只会报
    #      「Mixed Content」+「CORS header missing」两条，很容易查错方向。
    #   ② 跨源白名单要跟着访问地址变：局域网 IP / 域名 / localhost 各不相同，
    #      每加一个入口就得改后端 CORS 并重启。
    # 反代之后两者一起消失，并且 VITE_API_BASE_URL 可以写成**相对路径** `/api/v1`：
    # 同一份构建产物在 IP、域名、localhost 下都能直接用，不必为换地址重新构建。
    #
    # ⚠️ `^~` 不能省：下方有 `location ~* \.(svg|png|...)$` 这类**正则** location，
    #    正则的优先级高于普通前缀匹配。素材地址 /api/v1/assets/xxx.svg 会被正则
    #    那一条抢走，然后在静态目录里 404。`^~` 让本前缀匹配优先于正则。
    #
    # ⚠️ 本 location 里**不要写 add_header**（哪怕只是缓存头）：nginx 的 add_header
    #    只在本层没有 add_header 时才继承上层，写一条就会让上面那批安全响应头全丢。
    location ^~ /api/ {
        proxy_pass            http://127.0.0.1:8000;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 外层（Cloudflare Tunnel / 反代）已终止 TLS；这里只作信息透传，
        # 后端不依赖它生成绝对地址（ASSET_BASE_URL 留空 → 出参是相对路径）。
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Connection        "";
        # 素材上传：后端 ASSET_MAX_BYTES 默认 10MB，留一点余量
        client_max_body_size  12m;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        # 后台大文件导入 / 题库批量写入时不要缓冲到磁盘
        proxy_buffering       off;
    }

    # ---- 缓存策略 ----
    # ⚠️ 这里一律用 `expires` 而不是 `add_header Cache-Control`：
    #    nginx 的 add_header **只在本层没有 add_header 时才继承上层**。若在 location
    #    里写 add_header Cache-Control，上面那批安全响应头会**全部丢失**——而
    #    HTML 文档恰恰是最需要它们的地方。用 expires 不影响 add_header 的继承。
    #
    # 带内容哈希的静态资源：长效强缓存
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|otf|png|jpe?g|webp|gif|svg|ico)$ {
        expires 30d;
        access_log off;
    }

    # Service Worker：必须每次重新校验，否则更新无法生效（expires -1 → no-cache）
    location = /sw.js {
        expires -1;
    }

    location = /manifest.webmanifest {
        expires -1;
        types { } default_type application/manifest+json;
    }

    # index.html 不缓存，确保发版立即生效
    location = /index.html {
        expires -1;
    }

    # ---- SPA history fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 内容包 JSON（若由本容器托管远端静态内容）：短缓存，便于改错别字
    location /content/ {
        expires 5m;
        try_files $uri =404;
    }
}
