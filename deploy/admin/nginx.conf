# ============================================================================
# deploy/admin/nginx.conf —— apps/admin 的静态托管配置（**模板**）
#
# 说明：
#  - `${ADMIN_PORT}` 由容器启动时的 envsubst 渲染（见 apps/admin/Dockerfile
#    的 NGINX_ENVSUBST_FILTER，只替换该变量）。默认 8081。
#  - 容器使用 host 网络：**不监听 80**，避免与宿主机上既有服务冲突。
#  - 后台是内部工具：禁止被索引、禁止被 iframe 嵌套。
#
# ⚠️ 缓存策略一律用 `expires` 而不是 `add_header Cache-Control`：
#    nginx 的 add_header **只在本层没有 add_header 时才继承上层**。若在 location
#    里写 add_header Cache-Control，上面那批安全响应头会**全部丢失**（而 HTML
#    文档恰恰是最需要它们的地方）。用 expires 不会影响 add_header 的继承。
# ============================================================================

server {
    listen       ${ADMIN_PORT};
    listen       [::]:${ADMIN_PORT};
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;

    charset      utf-8;

    # ---- 安全响应头（内部工具，收敛得更紧） ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- 压缩 ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/javascript image/svg+xml;

    # ---- 接口反代（同源化）----
    # 与 deploy/web/nginx.conf 同一套理由（HTTPS 页面的混合内容 + 跨源白名单），
    # 详情见那边的注释。后台同样把 VITE_API_BASE_URL 写成相对路径 `/api/v1`。
    # ⚠️ 这里不要写 add_header：add_header 只在本层没有时才继承上层，
    #    写一条就会让上面那批安全响应头（含 noindex / DENY）整层失效。
    location ^~ /api/ {
        proxy_pass            http://127.0.0.1:8000;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Connection        "";
        # 素材上传（后台上传字卡插画 / 朗读音频是主要用途），留出余量
        client_max_body_size  12m;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_buffering       off;
    }

    # ---- 带内容哈希的构建产物：长效缓存 ----
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # index.html：绝不缓存，确保发版立即生效
    location = /index.html {
        expires -1;
    }

    location = /robots.txt {
        access_log off;
        try_files $uri =404;
    }

    # ---- SPA history fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
