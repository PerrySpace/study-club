# study-club api —— 单服务独立编排（只含 api 一个 service）。
# 说明：
#   - 构建上下文指向仓库根，Dockerfile 为 apps/api/Dockerfile
#   - network_mode: host：容器直连宿主网络中的 MongoDB（host 网络下用 localhost:27017）
#   - 容器环境变量取自仓库根 .env（env_file）；compose 变量插值取本目录 .env（可复制 .env.example）
#   - 端口由 API_PORT 控制
name: study-club-api

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: study-club-api:latest
    container_name: study-club-api
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../../.env
    volumes:
      # 只读挂载「内容即仓库」的两块数据，避免它们被烘焙进镜像后与仓库脱节：
      #   ① scripts/seed/data —— 新签发的邀请码 JSON / 新增的种子表文件，
      #      无需重建镜像即可被 scripts/seed/seed.sh 导入；
      #   ② content —— 内容 JSON 是「可版本管理、可 code review」的导入种子，
      #      后台「内容导入」会读它；改完重启容器即生效，不必重新 build。
      # 生产上若镜像即发布物、不打算改数据，可去掉这两行。
      - ../../scripts/seed/data:/app/scripts/seed/data:ro
      - ../../content:/app/content:ro
      # 素材存储（命名卷）：素材是**运行时真源**，既不能烘焙进镜像，
      # 也不能随仓库分发 —— 必须持久化在卷上，容器重建不丢。
      # 首次创建时卷会继承镜像里 /app/data/assets 的属主（appuser），无需 chown。
      - study-club-assets:/app/data/assets
    environment:
      # 冗余注入，便于 docker compose run 等场景；实际以 env_file 为准
      - API_PORT=${API_PORT:-8000}
      - API_PREFIX=${API_PREFIX:-/api/v1}
      # 容器内固定路径，与上面的命名卷挂载点一致
      # （覆盖 .env 里的相对路径，避免 CWD 变化导致素材写到想不到的地方）
      - ASSET_DIR=/app/data/assets
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port ${API_PORT:-8000}"]

volumes:
  study-club-assets:
    name: study-club-assets
